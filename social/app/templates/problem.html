{% extends "base.html" %}
{% block title %}{{ report.title }}{% endblock %}
{% block content %}
<p><a href="/problems">← Проблемы</a></p>
<div class="problem-tools card">
  <form method="post" action="/problems/{{ report.problem.id }}" class="inline">
    <label>Статус
      <select name="status" onchange="this.form.submit()">
        {% for k, v in STATUSES.items() %}<option value="{{ k }}" {% if report.problem.status == k %}selected{% endif %}>{{ v }}</option>{% endfor %}
      </select></label>
  </form>
  <form method="post" action="/problems/{{ report.problem.id }}" class="inline grow">
    <label class="grow">Название<input name="title" value="{{ report.problem.title }}"></label>
    <button class="btn small">Сохранить</button>
  </form>
  {% if others %}
  <form method="post" action="/problems/{{ report.problem.id }}" class="inline" onsubmit="return confirm('Объединить проблемы? Сообщения перейдут в выбранную.')">
    <label>Это та же проблема, что
      <select name="merge_into">{% for p in others %}<option value="{{ p.id }}">{{ p.title | truncate(70) }}</option>{% endfor %}</select></label>
    <button class="btn small">Объединить</button>
  </form>
  {% endif %}
  <form method="post" action="/problems/{{ report.problem.id }}" class="note-form">
    <label>Заметка по отработке<textarea name="note" rows="2" placeholder="Что сделано, кто ответственный, ответ жителям">{{ report.problem.note }}</textarea></label>
    <button class="btn small">Сохранить заметку</button>
  </form>
</div>
{% include "_report_actions.html" %}
<article class="report-screen">
{% include "_report_body.html" %}
</article>
{% endblock %}
