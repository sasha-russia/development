{# Period and filter controls shared by the dashboard. JS keeps them in the URL. #}
<form class="filters" id="filters" onsubmit="return false">
  <div class="chips" role="group" aria-label="Период">
    {% for key, (label, _) in periods.items() %}
    <button type="button" class="chip" data-period="{{ key }}">{{ label }}</button>
    {% endfor %}
    <button type="button" class="chip" data-period="custom">Свой период</button>
  </div>
  <div class="custom-range" hidden>
    <label>с <input type="datetime-local" name="from"></label>
    <label>по <input type="datetime-local" name="to"></label>
    <button type="button" class="btn small" id="apply-range">Показать</button>
  </div>
  <div class="chips" role="group" aria-label="Темы">
    {% for key, label in TOPICS.items() %}
    <button type="button" class="chip topic" data-topic="{{ key }}">{{ label }}</button>
    {% endfor %}
  </div>
  <div class="selects">
    <select name="sentiment" aria-label="Тональность">
      <option value="negative">Только негатив</option>
      <option value="">Любая тональность</option>
    </select>
    <select name="platform" aria-label="Соцсеть">
      <option value="">Telegram и VK</option>
      <option value="tg">Telegram</option>
      <option value="vk">ВКонтакте</option>
    </select>
    <select name="role" aria-label="Источники">
      <option value="">Все источники</option>
      <option value="governor">Соцсети губернатора</option>
      <option value="official">Страницы администрации</option>
      <option value="local">Городские сообщества</option>
    </select>
  </div>
</form>
