<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>{{ report.title }}</title>
<style>
  @page { size: A4; margin: 16mm 14mm 16mm 14mm;
    @bottom-left { content: "Мониторинг соцсетей · Мытищи"; font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 8pt; color: #8a8d93; }
    @bottom-right { content: counter(page) " / " counter(pages); font-family: "Liberation Sans", "DejaVu Sans", sans-serif; font-size: 8pt; color: #8a8d93; } }
  body { font-family: "Liberation Sans", "DejaVu Sans", Arial, sans-serif; font-size: 9.5pt; color: #1d1f23; line-height: 1.4; margin: 0; }
  {% if not for_pdf %}body { max-width: 900px; margin: 24px auto; padding: 0 16px; }{% endif %}
  a { color: #1f4e79; text-decoration: none; }
  .r-head { border-bottom: 2px solid #1d1f23; padding-bottom: 8px; margin-bottom: 12px; }
  .r-kicker { font-size: 8pt; text-transform: uppercase; letter-spacing: .06em; color: #8a8d93; }
  h1 { font-size: 17pt; margin: 4px 0 2px; line-height: 1.2; }
  h2 { font-size: 12pt; margin: 16px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #e4e2dc; }
  h3 { font-size: 10pt; margin: 10px 0 4px; }
  .r-sub, .r-period, .r-note, .r-muted { color: #6b6f76; margin: 2px 0; }
  .r-note { font-size: 8.5pt; }
  .r-kpis { display: flex; gap: 8px; margin: 10px 0; }
  .r-kpis > div { flex: 1; border: 1px solid #e4e2dc; border-radius: 4px; padding: 6px 8px; color: #6b6f76; font-size: 8.5pt; }
  .r-kpis b { display: block; font-size: 15pt; color: #1d1f23; }
  .r-kpis.small b { font-size: 12pt; }
  .r-kpis .neg b { color: #c40000; }
  .r-kpis .gov { border-color: #c40000; }
  .gov-text { color: #c40000; font-weight: bold; }
  .r-governor h2 { color: #c40000; border-color: #c40000; }
  .r-table { width: 100%; border-collapse: collapse; font-size: 8.8pt; }
  .r-table th { text-align: left; font-weight: bold; color: #6b6f76; border-bottom: 1px solid #1d1f23; padding: 4px 5px; }
  .r-table td { border-bottom: 1px solid #ecebe6; padding: 4px 5px; vertical-align: top; }
  .r-table tr { page-break-inside: avoid; }
  .r-facts th { width: 26%; border-bottom: 1px solid #ecebe6; }
  .q { border-left: 3px solid #d0cfc8; padding: 3px 0 3px 8px; margin: 6px 0; page-break-inside: avoid; }
  .q.s-negative { border-color: #e2401b; }
  .q.s-positive { border-color: #3a8a4f; }
  .q-meta { font-size: 8pt; color: #6b6f76; }
  .q-text { white-space: pre-wrap; margin: 2px 0; }
  .q-link { font-size: 7.5pt; color: #8a8d93; word-break: break-all; }
  .tone.negative { color: #c40000; } .tone.positive { color: #2f7a43; }
  .tone-bar { display: flex; height: 20px; border-radius: 3px; overflow: hidden; font-size: 8pt; color: #fff; }
  .tone-bar span { padding: 3px 6px; white-space: nowrap; overflow: hidden; }
  .tone-bar .negative { background: #d33a17; } .tone-bar .neutral { background: #8a8d93; } .tone-bar .positive { background: #3a8a4f; }
  .r-kind { font-size: 7.5pt; text-transform: uppercase; letter-spacing: .05em; color: #8a8d93; margin-top: 8px; }
</style>
</head>
<body>
{% include "_report_body.html" %}
</body>
</html>
