{# PDF and MAX buttons for a report. Needs report_kind and report_params. #}
{% set query = qs(report_kind, report_params) %}
<div class="report-actions">
  <a class="btn" href="/reports/pdf?{{ query }}" target="_blank">Скачать PDF</a>
  <a class="btn" href="/reports/print?{{ query }}" target="_blank">Версия для печати</a>
  <button class="btn primary" type="button" data-send="/reports/send?{{ query }}" {% if not max_ready %}disabled title="Заполните MAX_BOT_TOKEN и MAX_CHAT_ID в .env"{% endif %}>Отправить в MAX</button>
  <span class="send-result muted"></span>
</div>
<script>
document.querySelectorAll("[data-send]").forEach((b) => b.addEventListener("click", async () => {
  const out = b.parentElement.querySelector(".send-result");
  b.disabled = true; out.textContent = "Отправляю…";
  try {
    const data = await (await fetch(b.dataset.send, { method: "POST" })).json();
    out.textContent = data.ok ? "Отправлено в MAX" : "Ошибка: " + data.detail;
  } catch (e) { out.textContent = "Ошибка: " + e; }
  b.disabled = false;
}));
</script>
