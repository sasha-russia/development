{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block main_class %}login-wrap{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login">
  <h1>Мониторинг соцсетей</h1>
  <p class="muted">Городской округ Мытищи</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <label>Логин<input name="login" autocomplete="username" required autofocus></label>
  <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn primary">Войти</button>
</form>
{% endblock %}
